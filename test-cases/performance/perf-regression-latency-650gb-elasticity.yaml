test_duration: 3000
prepare_write_cmd: ["cassandra-stress write no-warmup cl=ALL n=325000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=1..325000000",
                    "cassandra-stress write no-warmup cl=ALL n=325000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=325000001..650000000",
                    "cassandra-stress write no-warmup cl=ALL n=325000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=650000001..975000000",
                    "cassandra-stress write no-warmup cl=ALL n=325000000 -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate threads=200 -col 'size=FIXED(1024) n=FIXED(1)' -pop seq=975000001..1300000000"]

stress_cmd_w: "cassandra-stress write no-warmup cl=QUORUM duration=2850m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=250 fixed=20332/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop 'dist=gauss(1..650000000,325000000,9750000)' "
stress_cmd_r: "cassandra-stress read no-warmup  cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=250 fixed=10310/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop 'dist=gauss(1..650000000,325000000,9750000)' "
stress_cmd_m: "cassandra-stress mixed no-warmup cl=QUORUM duration=800m -schema 'replication(strategy=NetworkTopologyStrategy,replication_factor=3)' -mode cql3 native -rate 'threads=250 fixed=8750/s' -col 'size=FIXED(1024) n=FIXED(1)' -pop 'dist=gauss(1..650000000,325000000,6500000)' "

n_db_nodes: 3
nemesis_add_node_cnt: 3
n_loaders: 4
n_monitor_nodes: 1

instance_type_loader: 'c7i.2xlarge'
instance_type_monitor: 't3.large'
instance_type_db: 'i7i.4xlarge'

nemesis_class_name: 'GrowShrinkClusterNemesis'
nemesis_interval: 30
nemesis_sequence_sleep_between_ops: 10

user_prefix: 'elasticity-test'
space_node_threshold: 644245094
ami_id_db_scylla_desc: 'VERSION_DESC'

round_robin: true
append_scylla_args: '--blocked-reactor-notify-ms 5 --abort-on-lsa-bad-alloc 1 --abort-on-seastar-bad-alloc --abort-on-internal-error 1 --abort-on-ebadf 1'
backtrace_decoding: false
print_kernel_callstack: true

store_perf_results: true
email_recipients: ["scylla-perf-results@scylladb.com"]
use_prepared_loaders: true
use_hdrhistogram: true
email_subject_postfix: 'elasticity test'
nemesis_double_load_during_grow_shrink_duration: 30
parallel_node_operations: true

use_preinstalled_scylla: true
force_run_iotune: true
